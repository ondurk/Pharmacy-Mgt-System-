services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: esart_pharmacy_web
    restart: unless-stopped
    ports:
      - "8085:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health/ | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      esart_pharmacy_internal:

networks:
  esart_pharmacy_internal:
    driver: bridge
    ipam:
      config:
        - subnet: ${COMPOSE_INTERNAL_SUBNET:-10.89.26.0/24}
